spring:
  datasource:
    url: jdbc:h2:mem:order_service_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  task:
    scheduling:
      enabled: false

app:
  coupon-platform:
    enabled: true
  payment-platform:
    enabled: true
